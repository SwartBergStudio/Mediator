name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

permissions:
  contents: write
  id-token: write # required for NuGet trusted publishing (OIDC)
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        
    - name: Determine version
      id: version
      run: |
        # Next version = latest vX.Y.Z tag bumped by the selected input (patch/minor/major).
        previous_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
        current=${previous_tag#v}
        current=${current%%-*}
        IFS=. read -r major minor patch <<< "${current:-0.0.0}"
        case "${{ inputs.version_bump }}" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          *)     patch=$((patch + 1)) ;;
        esac
        version="$major.$minor.$patch"
        if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
          echo "::error::Tag v$version already exists"; exit 1
        fi
        echo "Releasing $version (previous: ${previous_tag:-none})"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

    # The version lives in git tags (vX.Y.Z, created by the GitHub Release step below) and is passed to
    # the build as MSBuild properties; nothing is committed back to main.
    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: >-
        dotnet build --no-restore --configuration Release
        -p:Version=${{ steps.version.outputs.version }}
        -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
        -p:FileVersion=${{ steps.version.outputs.version }}.0

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Native AOT smoke test
      run: |
        dotnet publish samples/Mediator.AotSample --configuration Release -r linux-x64 -o ./aot-sample
        ./aot-sample/Mediator.AotSample

    - name: Pack NuGet packages
      run: |
        previous="${{ steps.version.outputs.previous_tag }}"
        # The library's public API is validated against the previous release; major releases may break it.
        dotnet pack src/Mediator/Mediator.csproj --no-build --configuration Release --output ./packages \
          -p:Version=${{ steps.version.outputs.version }} \
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 \
          -p:PackageValidationBaselineVersion=${previous#v} \
          -p:EnablePackageValidation=${{ inputs.version_bump != 'major' && steps.version.outputs.previous_tag != '' }}
        dotnet pack src/Mediator.SourceGenerator/Mediator.SourceGenerator.csproj --no-build --configuration Release --output ./packages \
          -p:Version=${{ steps.version.outputs.version }}

    - name: NuGet login (trusted publishing)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: SwartBerg # nuget.org profile that owns the package (public, not a secret)

    - name: Push to NuGet
      run: dotnet nuget push ./packages/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          ## SwartBerg.Mediator v${{ steps.version.outputs.version }}
          
          High-performance mediator for .NET 8, 9 and 10 with streaming requests, background notification processing, crash-safe persistence and Native AOT support.
          
          ### Key Features
          - Strongly-typed dispatch with no per-call reflection
          - Native AOT and trimming support via the source generator package
          - Background notification processing with channels
          - Optional persistence with file-based storage and retry logic
          - Pipeline behaviors for requests and streams
          
          ### Installation
          ```bash
          dotnet add package SwartBerg.Mediator --version ${{ steps.version.outputs.version }}
          # Optional, for Native AOT / trimmed apps:
          dotnet add package SwartBerg.Mediator.SourceGenerator --version ${{ steps.version.outputs.version }}
          ```
          
          ### Documentation
          - [README](https://github.com/SwartBergStudio/Mediator#readme) - Getting started and examples
          - [Performance Benchmarks](https://github.com/SwartBergStudio/Mediator#performance-benchmarks) - Latest performance data
          - [Contributing](https://github.com/SwartBergStudio/Mediator/blob/main/CONTRIBUTING.md) - How to contribute
          
          ---
          
          **Full Changelog**: https://github.com/SwartBergStudio/Mediator/compare/${{ steps.version.outputs.previous_tag }}...v${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        files: ./packages/*.nupkg
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./packages/*.nupkg

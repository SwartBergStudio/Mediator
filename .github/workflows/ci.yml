name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Redis for the persistence sample tests (they are skipped when no server is reachable).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_CONNECTION: localhost:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # tags are needed for the package API baseline
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # Tests run on every framework the library ships for.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Coverage report
      if: always()
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
        reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:./coverage/report -reporttypes:"MarkdownSummaryGithub;HtmlInline"
        cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: ./coverage/report

    - name: Native AOT smoke test
      run: |
        dotnet publish samples/Mediator.AotSample --configuration Release -r linux-x64 -o ./aot-sample
        ./aot-sample/Mediator.AotSample

    - name: Validate public API against the latest release
      run: |
        # Fails if a public API of SwartBerg.Mediator was removed or changed compared to the last published version.
        baseline=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
        baseline=${baseline#v}
        echo "API baseline: ${baseline:-none}"
        if [ -n "$baseline" ]; then
          dotnet pack src/Mediator/Mediator.csproj --configuration Release --output ./packages-ci \
            -p:Version=999.0.0-ci -p:AssemblyVersion=999.0.0.0 -p:PackageValidationBaselineVersion=$baseline
        fi

    # A .NET 8 app, built with the .NET 8 SDK, against the packages from this commit. Catches what the latest-SDK
    # build above can't: a source generator that needs a newer compiler, or library dependencies that force newer
    # Microsoft.Extensions.* packages onto older apps. See tests-compat/README.md.
    - name: Consumer compatibility (.NET 8 SDK)
      run: |
        dotnet pack src/Mediator/Mediator.csproj --configuration Release --output ./packages-ci \
          -p:Version=999.0.0-ci -p:AssemblyVersion=999.0.0.0 -p:EnablePackageValidation=false
        dotnet pack src/Mediator.SourceGenerator/Mediator.SourceGenerator.csproj --configuration Release --output ./packages-ci \
          -p:Version=999.0.0-ci
        cd tests-compat
        dotnet --version
        dotnet run --project Net8Consumer

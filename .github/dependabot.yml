# Keeps NuGet packages and GitHub Actions up to date with weekly pull requests.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Dependabot picks one version per package for the whole repo: the AOT sample's Microsoft.Extensions 10.0.0 ->
      # 10.0.12 counts as a patch, and it then writes 10.0.12 into every project, including the library's 8.0.0.
      # A "major updates only" ignore rule doesn't stop that, so the packages the published library and generator
      # depend on are not updated by Dependabot at all, in any project; bump them by hand.
      #
      # The library depends on the lowest supported Microsoft.Extensions.* versions (8.0.0) on purpose: anything
      # higher forces every app onto newer packages and breaks builds that pin 8.x/9.x (NU1605).
      - dependency-name: "Microsoft.Extensions.*"
      # The source generator must build against Roslyn 4.8 (the .NET 8 SDK compiler). A newer Roslyn makes the
      # generator fail to load for anyone on an older SDK (CS9057). The generator tests use the same version.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      # FluentAssertions 8+ is commercially licensed; stay on the Apache-licensed 6.x/7.x line.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
